<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#235b44" />
  <title>Reservet · Acceso</title>
  <link rel="stylesheet" href="/login.css" />
  <script src="/login.js" type="module"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="/" aria-label="Reservet, inicio">
      <span class="auth-brand-icon">r.</span>
      <span>reservet</span>
    </a>

    <section class="auth-card">
      <p class="auth-eyebrow">TU RESTAURANTE, EN ORDEN</p>
      <h1 id="auth-title">Bienvenido de nuevo</h1>
      <p id="auth-subtitle" class="auth-subtitle">
        Inicia sesión para gestionar tu salón.
      </p>

      <div id="auth-notice" class="auth-notice"
           role="alert" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <label for="login-email">Correo electrónico</label>
        <input
          id="login-email"
          name="email"
          type="email"
          maxlength="254"
          autocomplete="email"
          placeholder="nombre@restaurante.com"
          required
        />

        <label for="login-password">Contraseña</label>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          minlength="8"
          required
        />

        <button class="auth-primary" id="login-submit" type="submit">
          Iniciar sesión
        </button>
      </form>

      <form id="register-form" hidden novalidate>
        <label for="register-email">Correo electrónico</label>
        <input
          id="register-email"
          name="email"
          type="email"
          maxlength="254"
          autocomplete="email"
          placeholder="nombre@restaurante.com"
          required
        />

        <label for="register-password">Contraseña</label>
        <input
          id="register-password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <p class="auth-help">Usa al menos 8 caracteres.</p>

        <button class="auth-primary" id="register-submit" type="submit">
          Crear cuenta
        </button>
      </form>

      <p class="auth-switch">
        <span id="switch-copy">¿Todavía no tienes una cuenta?</span>
        <button id="switch-mode" type="button">Crear cuenta</button>
      </p>
    </section>

    <p class="auth-footer">Reservet · Gestión de mesas</p>
  </main>
</body>
</html>
